name: grouped-order-correction-postgres

on:
  pull_request:
    paths:
      - "supabase/migrations/20261108130000_qb_atomic_grouped_order_correction.sql"
      - "scripts/qb-atomic-grouped-order-correction-contract.sql"
      - ".github/workflows/grouped-order-correction-postgres.yml"
  push:
    branches: [codex/controlled-order-edits]
    paths:
      - "supabase/migrations/20261108130000_qb_atomic_grouped_order_correction.sql"
      - "scripts/qb-atomic-grouped-order-correction-contract.sql"
      - ".github/workflows/grouped-order-correction-postgres.yml"

jobs:
  postgres-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d contract"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated PostgreSQL contract
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          psql "postgresql://postgres:postgres@127.0.0.1:5432/contract" \
            -v ON_ERROR_STOP=1 -f scripts/qb-atomic-grouped-order-correction-contract.sql
